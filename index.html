<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>360° Virtual Tour</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="shortcut icon" type="image/png" href="./images/_src/favicon.png" />

  <!-- PSV Core Stylesheet -->
  <link rel="stylesheet" href="./vendor/@photo-sphere-viewer/core/index.min.css" />
  <!-- PSV Plugin Stylesheets -->
  <link rel="stylesheet" href="./vendor/@photo-sphere-viewer/markers-plugin/index.min.css" />
  <link rel="stylesheet" href="./vendor/@photo-sphere-viewer/gallery-plugin/index.min.css" />
  <link rel="stylesheet" href="./vendor/@photo-sphere-viewer/virtual-tour-plugin/index.min.css" />
  <link rel="stylesheet" href="./vendor/@photo-sphere-viewer/compass-plugin/index.min.css" />
  <link rel="stylesheet" href="./vendor/@photo-sphere-viewer/map-plugin/index.min.css" />

  <!-- Local Stylesheet (relative path) -->
  <link rel="stylesheet" href="./style.css" />

  <!-- Import Map: maps bare module specifiers to CDN URLs -->
  <script type="importmap">
    {
      "imports": {
        "three":                                      "./vendor/three/build/three.module.min.js",
        "@photo-sphere-viewer/core":                  "./vendor/@photo-sphere-viewer/core/index.module.js",
        "@photo-sphere-viewer/virtual-tour-plugin":   "./vendor/@photo-sphere-viewer/virtual-tour-plugin/index.module.js",
        "@photo-sphere-viewer/compass-plugin":        "./vendor/@photo-sphere-viewer/compass-plugin/index.module.js",
        "@photo-sphere-viewer/gallery-plugin":        "./vendor/@photo-sphere-viewer/gallery-plugin/index.module.js",
        "@photo-sphere-viewer/markers-plugin":        "./vendor/@photo-sphere-viewer/markers-plugin/index.module.js",
        "@photo-sphere-viewer/map-plugin":            "./vendor/@photo-sphere-viewer/map-plugin/index.module.js",
        "@photo-sphere-viewer/autorotate-plugin":     "./vendor/@photo-sphere-viewer/autorotate-plugin/index.module.js"
      }
    }
  </script>
</head>
<body>

  <!-- Full-viewport viewer container -->
  <div id="viewer"></div>

  <!-- Loading Screen Overlay -->
  <div id="loading-screen" class="glass-panel">
    <div class="spinner"></div>
    <div id="loading-text">Loading Virtual Tour...</div>
  </div>

  <!-- Gridlines and Crosshair for debugging/alignment (hidden by default) -->
  <div id="gridlines"></div>
  <div id="crosshair"></div>

  <!-- Debug Tools (hidden by default, shown in debug mode) -->
  <div id="debug-controls-container" class="debug-controls-container">
    <button id="debug-copy-url-btn" class="debug-btn" title="Copy current view URL (C)">🔗 Copy URL</button>
    <button id="debug-add-link-btn" class="debug-btn debug-add-link-btn" title="Add navigation link at crosshair">➕ Add Link</button>
    <button id="debug-add-marker-btn" class="debug-btn debug-add-marker-btn" title="Add marker at crosshair">➕ Add Marker</button>
  </div>

  <div id="debug-link-modal" class="debug-modal">
    <div class="debug-modal-panel glass-panel">
      <h3>Select Destination Scene</h3>
      <input id="debug-link-search" type="text" placeholder="Filter scenes…" autocomplete="off" />
      <ul id="debug-link-scene-list" class="debug-list"></ul>
      <button id="debug-link-cancel" class="debug-cancel-btn">Cancel</button>
    </div>
  </div>

  <div id="debug-marker-modal" class="debug-modal">
    <div class="debug-modal-panel glass-panel">
      <h3>Add New Marker</h3>
      <div class="debug-form-group">
        <label>Marker ID:</label>
        <input type="text" id="debug-marker-id" placeholder="e.g. info-bookshelf-1" />
      </div>
      <div class="debug-form-group">
        <label>Type:</label>
        <select id="debug-marker-type">
          <option value="info">Info (Text Content)</option>
          <option value="audio">Audio (Sound Clip)</option>
          <option value="image">Image (Custom Icon)</option>
        </select>
      </div>
      <div class="debug-form-group">
        <label>Tooltip / Title:</label>
        <input type="text" id="debug-marker-title" placeholder="Hover text" />
      </div>
      <div class="debug-form-group" id="debug-marker-content-group">
        <label>Content (HTML):</label>
        <textarea id="debug-marker-content" rows="3" placeholder="<p>Information goes here</p>"></textarea>
      </div>
      <div class="debug-form-group" id="debug-marker-audio-group" style="display:none;">
        <label>Audio File path:</label>
        <input type="text" id="debug-marker-audio" placeholder="./audio/narration/file.mp3" />
      </div>
      <div class="debug-modal-actions">
        <button id="debug-marker-save" class="debug-save-btn">Save Marker</button>
        <button id="debug-marker-cancel" class="debug-cancel-btn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Scene Inspector Panel -->
  <div id="debug-scene-inspector" class="debug-panel glass-panel" style="display: none;">
    <div class="debug-panel-header">
      <h3>Scene Inspector</h3>
      <button id="debug-inspector-close" class="debug-close-btn">×</button>
    </div>
    <div class="debug-panel-content" id="debug-inspector-content">
      <!-- Populated by JS -->
    </div>
  </div>

  <!-- Graph Minimap Panel -->
  <div id="debug-graph-minimap" class="debug-panel glass-panel" style="display: none;">
    <div class="debug-panel-header">
      <h3>Tour Graph</h3>
      <button id="debug-graph-close" class="debug-close-btn">×</button>
    </div>
    <div class="debug-panel-content">
      <canvas id="debug-graph-canvas" width="400" height="300"></canvas>
    </div>
  </div>

  <div id="debug-toast" class="debug-toast"></div>

  <!-- Main application script (ES Module, relative path) -->
  <script type="module" src="./main.js"></script>

</body>
</html>
