<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PPAPP 360° Virtual Tour Frontpage">
  <title>PPAPP 360° Virtual Tour - Home</title>
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./frontpage.css">
</head>
<body class="frontpage-body">
  <header class="frontpage-header">
    <div class="logo-container">
      <img src="./favicon.png" alt="PPAPP Logo" class="frontpage-logo">
      <h1>PPAPP 360° Virtual Tour</h1>
    </div>
    <p>Explore our library branches in immersive 360° view.</p>
    
    <div class="search-container">
      <input type="text" id="scene-search" placeholder="Search for locations, rooms, or tags..." autocomplete="off">
      <div id="search-results" class="search-results glass-panel is-hidden"></div>
    </div>
  </header>

  <main class="frontpage-main">
    <section class="branches-container">
      <h2>Select a Branch</h2>
      <div class="branches-grid" id="branches-grid">
        <!-- Branches will be injected here via JS -->
      </div>
    </section>
  </main>

  <footer class="frontpage-footer">
    <p>&copy; 2026 Perbadanan Perpustakaan Awam Pulau Pinang</p>
  </footer>

  <script type="module" src="./frontpage.js"></script>
</body>
</html>
