<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>360° Virtual Tour</title>

  <!-- PSV Core Stylesheet -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.min.css" />
  <!-- PSV Plugin Stylesheets -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin/index.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/gallery-plugin/index.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/virtual-tour-plugin/index.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/compass-plugin/index.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/map-plugin/index.min.css" />

  <!-- Local Stylesheet (relative path) -->
  <link rel="stylesheet" href="./style.css" />

  <!-- Import Map: maps bare module specifiers to CDN URLs -->
  <script type="importmap">
    {
      "imports": {
        "three":                                      "https://cdn.jsdelivr.net/npm/three/build/three.module.min.js",
        "@photo-sphere-viewer/core":                  "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.module.js",
        "@photo-sphere-viewer/virtual-tour-plugin":   "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/virtual-tour-plugin/index.module.js",
        "@photo-sphere-viewer/compass-plugin":        "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/compass-plugin/index.module.js",
        "@photo-sphere-viewer/gallery-plugin":        "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/gallery-plugin/index.module.js",
        "@photo-sphere-viewer/markers-plugin":        "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin/index.module.js",
        "@photo-sphere-viewer/map-plugin":            "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/map-plugin/index.module.js",
        "@photo-sphere-viewer/autorotate-plugin":     "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/autorotate-plugin/index.module.js"
      }
    }
  </script>
</head>
<body>

  <!-- Full-viewport viewer container -->
  <div id="viewer"></div>

  <!-- Loading Screen Overlay -->
  <div id="loading-screen" class="glass-panel">
    <div class="spinner"></div>
    <div id="loading-text">Loading Virtual Tour...</div>
  </div>

  <!-- Gridlines and Crosshair for debugging/alignment (hidden by default) -->
  <div id="gridlines"></div>
  <div id="crosshair"></div>

  <!-- Main application script (ES Module, relative path) -->
  <script type="module" src="./main.js"></script>

</body>
</html>
